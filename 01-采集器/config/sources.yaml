# Vestas / SGRE：两家新闻列表都由 JS 渲染，静态 HTML 里 0 条（实测）。
# sitemap 是唯一静态可得的清单，但各有缺陷：
#   Vestas  sitemap 有 lastmod，但更新滞后（实测最新只到 2026-02，而列表页已到 11 月）
#   SGRE    sitemap 有 391 条 press-release，但整站没有 lastmod，只能靠 URL 日期戳
# 两者都需要同样一层：上游一更新、sitemap 紧跟，就能采到；滞后时采不到也不会误报新。
# 因此默认 enabled: false——先不产出不可信的时间，等确认 sitemap 会跟随更新再打开。
- name: Vestas 维斯塔斯（sitemap）
  module: wind_peers
  kind: sitemap
  url: https://www.vestas.com/sitemap.xml
  url_pattern: /en/media/company-news/20\d\d/
  url_pattern_note: 只取公司新闻，不取产品页
  tier: official
  default_domain: 能源AI
  questions: [Q01, Q05]
  max_items: 25
  enabled: false
  verified: true
  note: 列表页 JS 渲染抓不到；sitemap 有 lastmod 但滞后（实测最新 2026-02）。等确认更新及时再开。

- name: Siemens Gamesa（sitemap）
  module: wind_peers
  kind: sitemap
  url: https://www.siemensgamesa.com/sitemap.xml
  url_pattern: press-release
  tier: official
  default_domain: 能源AI
  questions: [Q01, Q05]
  max_items: 25
  enabled: false
  verified: true
  note: 391 条新闻页可解析，但整站无 lastmod，只能靠 URL 日期戳判断新鲜度。等核实再开。
