feed_topic_id:
  default: 632
  type: integer
  min: 0
  description: "数据底座帖所在话题的 ID（现为 632）。0 表示关闭整个 AI 雷达首页区块。该话题须对匿名用户可读。"

feed_post_number:
  default: 1
  type: integer
  min: 1
  description: "数据在话题的第几楼，默认第 1 楼。"

outlet_name:
  default: "discovery-list-container-top"
  type: string
  description: "区块插入的位置（插件出口名）。若首页看不到区块，可改成 above-main-container 再试。"

homepage_paths:
  default: "/latest?radar=1"
  type: string
  description: "显示区块的页面路径或带参数路径，英文逗号分隔。v0.5.2 默认为 /latest?radar=1（配合 Nav Links 插件做成【AI雷达】独立标签页，不影响【热门】【最新】默认首页）。如需恢复在原首页展示，可改回 /,/latest。"

radar_query_param:
  default: "radar"
  type: string
  description: "向 Discourse 发现页路由注册的查询参数名（默认 radar，对应 /latest?radar=1），防止被 Discourse 路由自动剥离。留空则不注册。"

hide_topic_list_on_radar_tab:
  default: true
  type: bool
  description: "处于带查询参数的独立标签页（如 /latest?radar=1）时，隐藏下方原本的帖子列表，仅展示 AI 雷达完整看板。"

compact_banner_on_radar_tab:
  default: true
  type: bool
  description: "处于独立【AI雷达】标签页时，自动收紧顶部欢迎横幅，为首屏内容腾出更多展示空间。"

show_section_nav:
  default: true
  type: bool
  description: "在 AI 雷达刊头下方显示轻量快捷目录条（趋势洞察 / 技术深读 / 信号雷达 / 主题追踪）。"

feedback_url:
  default: "/c/2"
  type: string
  description: "底部页脚「推荐信源 / 反馈建议」链接地址，留空则不显示。"

brand_title:
  default: "AI 雷达"
  type: string
  description: "区块大标题。"

brand_subtitle:
  default: "3 分钟读懂 AI 前沿 × 风电能源"
  type: string
  description: "大标题下的一行副标题。"

schedule_note:
  default: "每天 08:00 · 12:00 · 16:00 自动采集 · 08:30 深度简报"
  type: string
  description: "页头/页脚的更新节奏说明。"

show_search:
  default: false
  type: bool
  description: "显示“搜索社区”输入框。v0.4 起默认关闭：论坛页头已有搜索，两处重复。"

side_source:
  default: "energy"
  type: string
  description: "“今日焦点”右侧栏取什么：energy＝采集器按集团问题（Q01 风电 AI 场景 / Q02 人工智能+能源政策 / Q09 AI 用电需求与风电机会）筛出的能源向信号（默认）；category＝按下面的 side_category 读某个论坛分类。"

side_label:
  default: "金风 / 能源相关"
  type: string
  description: "右侧栏标题（side_source=energy 时用）。"

energy_note:
  default: "从下方信号雷达按能源视角挑选"
  type: string
  description: "右侧栏底部的小字说明。这一栏的条目同样存在于下方“信号雷达”里（雷达保持完整，不做删减），写明来源避免读者以为漏了。留空则不显示。"

side_category:
  default: "18:深度阅读"
  type: string
  description: "side_source=category 时，右侧栏读取的分类，格式 分类ID:显示名。"

topics_per_column:
  default: 3
  type: integer
  min: 1
  max: 8
  description: "side_source=category 或按主题看启用时，每个分组显示几篇。"

theme_tags:
  default: "agent:智能体,大模型:大模型,skills:Skills"
  type: string
  description: "“按主题看”读取的标签，格式 标签:显示名，英文逗号分隔。标签名要和论坛里实际的标签一致（可以是中文）。留空则不显示这一块。"

show_themes:
  default: false
  type: bool
  description: "是否显示“按主题看”（标签驱动的跨分类聚合）。默认关闭。"

radar_initial_count:
  default: 6
  type: integer
  min: 3
  max: 60
  description: "信号雷达默认先显示多少条（桌面 3 列下 6 条 = 两排），其余折叠并点“展开其余”。"

stale_hours:
  default: 36
  type: integer
  min: 1
  description: "过期提示的兜底规则：数据带“下一轮更新时间”时，超过该时间 6 小时仍未更新才提示（周末、节假日不会误报）；不带时，超过这里的小时数才提示。"

collapse_radar_on_mobile:
  default: true
  type: bool
  description: "手机端默认折叠信号雷达。"

radar_stale_grace_hours:
  default: 2
  type: integer
  min: 1
  description: "信号雷达过期提示：采集器写了下一轮时间时，超过它这么多小时仍未刷新才提示“采集可能暂停”。"

radar_stale_hours:
  default: 16
  type: integer
  min: 1
  description: "信号雷达过期提示的兜底规则：数据里没有下一轮时间时，距上次刷新超过这么多小时才提示。"

show_topics:
  default: true
  type: bool
  description: "显示“主题追踪”区块（数据由主题档案 skill 每周写入底座帖 topics 字段）。"

show_stance:
  default: true
  type: bool
  description: "显示“集团技术雷达”区块（数据由技术雷达 skill 每季度写入底座帖 stance 字段）。"

curated_initial_count:
  default: 3
  type: integer
  min: 1
  max: 20
  description: "精编默认显示几条（按与金风相关度排序，跳过上面简报、值得看已出现的），其余折叠在“展开其余 N 条”里。"
