# ============================================================================
# 检索词库 V2.0（草稿 · 待审查）
# 2026-11-19  gw-ai-pulse
#
# 状态：**尚未接入代码**。采集器目前只读 config/queries.yaml。
#       本文件在 docs/2026-11-19-检索词库V2.0-设计与迁移.md §8 的决策确认后，
#       才会被 collector/queries.py 读取（届时 queries.yaml 保留为 v1 回滚基线）。
#
# 设计原则（2026-11-19 定）：
#   1. 只用免费、免 key 的后端（Bing News RSS / Google News RSS / HN / arXiv）。
#   2. 每轮全量执行，不做 T0/T1/T2 跳轮；priority 只用于统计与额度。
#   3. 每条 query 只承担一个检索意图，不再把主题+企业+技术堆在一条里。
#   4. 中英文分开配置：中文只投 bing/gnews，英文只投 bing/hn/arxiv。
# ============================================================================
version: 2.0.0
updated: "2026-11-19"

round_policy:
  every_round: true          # 全量每轮（默认决策）
  # 若将来要分层：把 priority 改成 T0/T1/T2 并实现跳轮逻辑；当前实现不使用
  layers: [all]

# ---------------------------------------------------------------------------
# 后端：全部免费、免 key。实测见 docs/2026-11-19-检索词库V2.0-设计与迁移.md §4.1
# ---------------------------------------------------------------------------
backends:
  bing:
    kind: bing_news
    enabled: true
    module: ext_ai
    tier: media                 # 逐条按 publisher_tiers 覆盖
    endpoint: https://www.bing.com/news/search
    params: {format: rss, sortby: date, count: 30}
    supports_lang: [en, zh]
    min_interval_seconds: 0.5
    note: link 里的 url= 参数解码即真实原文；description 是正文导语
  gnews:
    kind: gnews
    enabled: true
    module: ext_ai
    tier: media
    endpoint: https://news.google.com/rss/search
    params: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}
    supports_lang: [zh]
    min_interval_seconds: 2.5   # 实测：间隔 <2s 会 429
    note: 链接是 news.google.com 跳转，无法回溯原文；入库时标记"线索"
  hn:
    kind: hn_search
    enabled: true
    module: ext_ai
    tier: community
    endpoint: https://hn.algolia.com/api/v1/search
    params: {tags: story, hitsPerPage: 20}
    supports_lang: [en]         # 中文 query 实测 0 命中
  arxiv:
    kind: arxiv_search
    enabled: false              # 默认关；只给 research 类词手动开
    module: ext_ai
    tier: research
    endpoint: http://export.arxiv.org/api/query
    supports_lang: [en]
    min_interval_seconds: 3

# Bing/Google 返回的媒体名 → tier 映射。未命中的一律按 media 处理。
publisher_tiers:
  新华社: authority
  新华网: authority
  人民网: authority
  人民日报: authority
  中国政府网: authority
  国家能源局: authority
  国家发展改革委: authority
  工业和信息化部: authority
  国家网信办: authority
  央视新闻: authority
  中国电力报: media
