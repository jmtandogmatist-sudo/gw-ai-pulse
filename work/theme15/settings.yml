feed_topic_id:
  default: 632
  type: integer
  min: 0
  description: "数据底座帖所在话题的 ID（现为 632）。0 表示关闭整个 AI 雷达首页区块。该话题须对匿名用户可读。"

feed_post_number:
  default: 1
  type: integer
  min: 1
  description: "数据在话题的第几楼，默认第 1 楼。"

outlet_name:
  default: "discovery-list-container-top"
  type: string
  description: "区块插入的位置（插件出口名）。若首页看不到区块，可改成 above-main-container 再试。"

homepage_paths:
  default: "/,/latest"
  type: string
  description: "显示区块的页面路径，英文逗号分隔。默认只在首页（/ 与 /latest）显示。"

brand_title:
  default: "AI 雷达"
  type: string
  description: "区块大标题。"

brand_subtitle:
  default: "每日洞察 AI 赋能风电"
  type: string
  description: "大标题下的一行副标题。"

schedule_note:
  default: "工作日 07:30 · 12:30 · 18:30 自动采集"
  type: string
  description: "右上角的更新节奏说明。"

show_search:
  default: false
  type: bool
  description: "显示“搜索社区”输入框。v0.4 起默认关闭：论坛页头已有搜索，两处重复。"

side_category:
  default: "18:深度阅读"
  type: string
  description: "“今日焦点”右侧栏读取的分类，格式 分类ID:显示名。留空则不显示右侧栏。"

column_categories:
  default: "19:一招一式,16:金风实践,7:AI工具与办公"
  type: string
  description: "“栏目更新”读取的分类，格式 分类ID:显示名，英文逗号分隔，按顺序显示。留空则不显示。"

topics_per_column:
  default: 3
  type: integer
  min: 1
  max: 8
  description: "每个栏目与右侧栏显示几篇。"

hot_count:
  default: 5
  type: integer
  min: 0
  max: 10
  description: "“社区热帖”显示几篇（读论坛热门，读不到时退回本周热门）。0 表示不显示。"

radar_initial_count:
  default: 12
  type: integer
  min: 3
  max: 60
  description: "信号雷达默认先显示多少条，其余点“展开其余”。"

stale_hours:
  default: 36
  type: integer
  min: 1
  description: "过期提示的兜底规则：数据带“下一轮更新时间”时，超过该时间 6 小时仍未更新才提示（周末、节假日不会误报）；不带时，超过这里的小时数才提示。"

collapse_radar_on_mobile:
  default: true
  type: bool
  description: "手机端默认折叠信号雷达。"

radar_stale_grace_hours:
  default: 2
  type: integer
  min: 1
  description: "信号雷达过期提示：采集器写了下一轮时间时，超过它这么多小时仍未刷新才提示“采集可能暂停”。"

radar_stale_hours:
  default: 16
  type: integer
  min: 1
  description: "信号雷达过期提示的兜底规则：数据里没有下一轮时间时，距上次刷新超过这么多小时才提示。"

show_topics:
  default: true
  type: bool
  description: "显示“主题追踪”区块（数据由主题档案 skill 每周写入底座帖 topics 字段）。"

show_stance:
  default: true
  type: bool
  description: "显示“集团技术雷达”区块（数据由技术雷达 skill 每季度写入底座帖 stance 字段）。"

curated_initial_count:
  default: 3
  type: integer
  min: 1
  max: 20
  description: "精编默认显示几条（按与金风相关度排序，跳过上面简报、值得看已出现的），其余折叠在“展开其余 N 条”里。"
